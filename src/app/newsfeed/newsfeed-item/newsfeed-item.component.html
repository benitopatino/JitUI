
	<div class="card mb-3 shadow bg-white rounded p-2 " style="min-height:120px">
		<div class="card-body d-flex align-items-start">

			<img src="{{newsfeedItem.avatarUrl}}" class="rounded-circle me-3" width="50" height="50" alt="Avatar">
			<div>
				<p class="card-subtitle text-muted">{{newsfeedItem.authorFullName.toUpperCase()}}</p>
				<p>{{newsfeedItem.content}}</p>
				<p>{{ newsfeedItem.dateCreated | date: 'medium' }}</p>
			</div>

		</div>
	</div>
